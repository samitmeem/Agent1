[project]
name = "voice"
version = "0.1.0"
description = "Ticket Assistant voice service (Faster-Whisper STT + Kokoro TTS)"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0",
    "kokoro>=0.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
vad = ["webrtcvad>=2.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["voice*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
