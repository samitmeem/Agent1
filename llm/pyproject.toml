[project]
name = "llm"
version = "0.1.0"
description = "LiteLLM router wrapper (Qwen-first, DeepSeek fallback)"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.30",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm*"]
