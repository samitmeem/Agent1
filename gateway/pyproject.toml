[project]
name = "gateway"
version = "0.1.0"
description = "Ticket Assistant FastAPI Gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pydantic>=2.6",
    "python-jose[cryptography]>=3.3",
    "starlette>=0.36",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
