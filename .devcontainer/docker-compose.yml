version: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      # Forwards the local Docker socket to the container.
      - /var/run/docker.sock:/var/run/docker-host.sock
      # Update this to wherever you want VS Code to mount the folder of your project
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    entrypoint: /usr/local/share/docker-init.sh
    command: sleep infinity

    # Join the shared network so the dev container can reach postgres/redis
    # (defined in deploy/docker-compose.yml) by their service names via Docker
    # DNS. The network is created by the deploy compose stack on first boot:
    #   docker network create agent1_shared
    networks:
      - default
      - agent1_shared
    # Uncomment the next four lines if you will use a ptrace-based debuggers like C++, Go, and Rust.
    # cap_add:
    #  - SYS_PTRACE
    # security_opt:
    #   - seccomp:unconfined

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)

networks:
  agent1_shared:
    # External network shared with deploy/docker-compose.yml services so the
    # dev container resolves `postgres` and `redis` by name.
    external: true
